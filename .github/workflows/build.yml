name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle --no-daemon assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk Orezet-1.${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Orezet
          path: Orezet-1.${{ github.run_number }}.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v1.${{ github.run_number }} Orezet-1.${{ github.run_number }}.apk --title "Orezet 1.${{ github.run_number }}" --notes "Install the APK on the phone."
