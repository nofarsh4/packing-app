<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karantina:wght@400;700&family=Rubik:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow phone-first column. A single loud sea-colored reminder card on top, quiet lists below. */
:root{

}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#08262C; --surface:#10373F; --surface2:#17474F; --ink:#E4F4F1; --muted:#8FB3B5; --line:#215661;
  --sea:#1AA7AD; --sea-deep:#0C5A66; --on-sea:#FFFFFF; --coral:#FF7C93; --sun:#FFCF5C; --on-sun:#3A2A00;
  --crit:#FF7C93; --mid:#FFCF5C; --low:#8FB3B5; --ok:#5ED39B; --shadow:0 6px 20px rgba(0,0,0,.35); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#08262C; --surface:#10373F; --surface2:#17474F; --ink:#E4F4F1; --muted:#8FB3B5; --line:#215661;
  --sea:#1AA7AD; --sea-deep:#0C5A66; --on-sea:#FFFFFF; --coral:#FF7C93; --sun:#FFCF5C; --on-sun:#3A2A00;

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
#wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px 90px;direction:rtl}
button,input,textarea,select{font:inherit;color:inherit}

.btn.pri{background:var(--sea);border-color:var(--sea);color:var(--on-sea);font-weight:700}

/* reminders */
.rem{position:relative;overflow:hidden;border-radius:22px;padding:18px 18px 14px;color:var(--on-sea);
  background:linear-gradient(160deg,var(--sea) 0%,var(--sea-deep) 100%);box-shadow:var(--shadow);min-height:170px;display:flex;flex-direction:column;gap:8px}

.prog{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}

.bar.c i{background:var(--coral)}

.chips{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:8px 0;margin-bottom:6px;scrollbar-width:none}

.sec{margin-top:18px;scroll-margin-top:60px}
.sec h2{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:1.9rem;font-weight:700;margin-bottom:8px}
.sec h2 .cnt{font-family:var(--body);font-size:.9rem;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.dot{width:12px;height:12px;border-radius:50%;flex:none;background:var(--muted)}
.s-packed{background:var(--ok)}.s-ready{background:var(--sea)}.s-wash{background:#5B8DEF}.s-buy{background:var(--coral)}.s-find{background:var(--sun)}.s-make{background:#E58A2B}.s-other{background:#9B7BD8}
details.skipbox{margin-top:22px}details.skipbox summary{cursor:pointer;min-height:44px;display:flex;align-items:center;color:var(--muted);font-weight:500}
.savedrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--line)}.savedrow span{flex:1 1 140px;min-width:0;overflow-wrap:anywhere}
.empty{color:var(--muted);font-size:.9rem;padding:6px 2px}
.row{background:var(--surface);border-radius:14px;padding:10px 12px;margin-bottom:8px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;border-inline-start:5px solid var(--line)}
.row.imp-crit{border-inline-start-color:var(--crit)}.row.imp-mid{border-inline-start-color:var(--sun)}
.rmain{flex:1 1 150px;min-width:0;text-align:start;display:flex;flex-direction:column;min-height:40px;justify-content:center}
.rname{font-weight:500;overflow-wrap:anywhere}
.row.done .rname{color:var(--muted)}
.rmeta{font-size:.78rem;color:var(--muted)}
.rmeta .c{color:var(--crit);font-weight:700}
.rbtns{display:flex;gap:6px;flex-wrap:wrap}
.thumb{width:42px;height:42px;border-radius:10px;overflow:hidden;flex:none;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}

/* quiz */
.qwrap{display:flex;flex-direction:column;gap:14px}
.qcard{background:var(--surface);border-radius:24px;padding:22px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.qcat{font-size:.85rem;color:var(--muted)}
.qname{font-family:var(--display);font-size:3rem;font-weight:700;line-height:.95;overflow-wrap:anywhere}
.qq{font-size:1.1rem;font-weight:500}
.qopt{min-height:56px;border-radius:16px;border:2px solid var(--line);background:var(--bg);font-weight:500;font-size:1.05rem;padding:10px 14px;text-align:start;display:flex;align-items:center;gap:10px}
.qopt .dot{width:14px;height:14px}
.qopt:active{border-color:var(--sea)}
.hello{font-family:var(--display);font-size:3.4rem;font-weight:700;line-height:.9}

/* sheet & overlays */
.scrim{position:fixed;inset:0;background:rgba(4,24,28,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{direction:rtl;background:var(--bg);width:100%;max-width:560px;max-height:88%;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet h3{font-family:var(--display);font-size:2.2rem;font-weight:700;line-height:1;overflow-wrap:anywhere}
.lbl{font-size:.82rem;color:var(--muted);margin-bottom:-6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sel{background:var(--sea)!important;border-color:var(--sea)!important;color:var(--on-sea)!important}
.viewer{direction:rtl;background:var(--bg);border-radius:20px;padding:12px;margin:auto 16px;max-width:520px;width:100%;display:flex;flex-direction:column;gap:10px}
.viewer img{width:100%;max-height:60vh;object-fit:contain;border-radius:12px;background:var(--surface2)}
#toast{position:fixed;inset-inline:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;justify-content:center;pointer-events:none}
#toast div{direction:rtl;pointer-events:auto;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:14px;display:flex;gap:12px;align-items:center;max-width:520px;box-shadow:var(--shadow)}
#toast button{background:var(--sun);color:var(--on-sun);font-weight:700;border-radius:10px;padding:6px 12px;min-height:36px;white-space:nowrap}
#fx{position:fixed;inset:0;pointer-events:none;z-index:40}
.egrp{font-weight:700;margin:14px 0 6px}
.bagh{display:flex;align-items:baseline;gap:6px;font-weight:700;font-size:.95rem;margin:12px 2px 6px;color:var(--sea)}
.bagh span{font-weight:500;color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums}
.bagh.ask{color:var(--crit)}
.bagpick{display:flex;flex-wrap:wrap;gap:6px;margin:-2px 0 12px}
.bagpick button{min-height:36px;padding:4px 11px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);font-size:.85rem}
.shop{padding:6px 14px}
.shoprow{display:flex;align-items:center;gap:12px;min-height:44px;border-bottom:1px solid var(--line);cursor:pointer}
.shoprow:last-child{border-bottom:0}
.shoprow input{width:22px;height:22px;flex:none;accent-color:var(--sea)}
.shoprow span{flex:1;min-width:0;overflow-wrap:anywhere}
.shoprow b{font-size:.72rem;color:var(--crit)}
.shoprow.d span{text-decoration:line-through;color:var(--muted)}
.addbox{margin-bottom:10px}
.casebox{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.casebox svg{width:46%;max-width:190px;flex:none;height:auto}
.casetxt{min-width:0;flex:1}
.casepct{font-size:3.4rem;color:var(--sea)}
.askout{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--surface2);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:.95rem}
.askout.wait{color:var(--muted)}
.erow{display:flex;gap:6px;margin-bottom:6px}
.erow input{flex:1;min-width:0}
.foot{margin-top:26px;text-align:center;color:var(--muted);font-size:.8rem}
</style>

<script>
(function(){
document.documentElement.lang='he';
const LS='orezet-leeilat-v1';
const STATUS={packed:'ארוז',ready:'מוכן לאריזה',wash:'לכבס',buy:'לקנות',find:'למצוא בבית',make:'להכין בבית',other:'אחר',skip:'לא לוקחת'};
const ORDER=['packed','ready','wash','buy','find','make','other'];
const IMP={crit:'קריטי',mid:'די חשוב',low:'לא יקרה כלום אם אשכח'};
const IMPS={crit:'קריטי',mid:'די חשוב',low:'לא נורא'};
const IMPRANK={crit:0,mid:1,low:2};
const BAGS=['מזוודה','תיק אישי קטן','תיק רחצה','תיק עדשות','בגדים','תרופות','אוכל','ציוד כדורשת','תיק נעליים','אחר'];
function guessBag(i){
  const n=i.name,c=i.cat||'';
  if(/נעלי|סנדל|כפכפ|סניקרס/.test(n)) return 'תיק נעליים';
  if(c.includes('תרופות')) return 'תרופות';
  if(c.includes('אוכל')) return 'אוכל';
  if(c.includes('עדשות')||/סליין|עדשות|תמיסה|טיפות עיניים|מגבוני עיניים/.test(n)) return 'תיק עדשות';
  if(c.includes('רחצה')) return 'תיק רחצה';
  if(c.includes('ספורט')||c.includes('כדורשת')) return 'ציוד כדורשת';
  if(c.includes('בגדים')) return 'בגדים';
  if(/ארנק|מטען|משקפי שמש|אוזניות|תעודת|מזומן|סוללה|אישור|מפתח|טלפון/.test(n)) return 'תיק אישי קטן';
  if(/ליברו|כדורשת|מגני|מחממי|תלבושת|טייפ/.test(n)) return 'ציוד כדורשת';
  if(/פיג׳מה|פיג'מה|חולצ|מכנס|טייץ|שמלה|תחתונ|חזי|גרבי|ג׳קט|עליונ|בגד ים|כובע/.test(n)) return 'בגדים';
  if(/שיניים|סבון|שמפו|דאודורנט|קרם|מסרק|גילוח|לחפוף/.test(n)) return 'תיק רחצה';
  if(/כריכ|בננ|מים|חטיפ|טעים|כוסות/.test(n)) return 'אוכל';
  if(c==='מזוודה') return 'מזוודה';
  return null;
}
function fixCats(){ if(state&&state.items) state.items.forEach(i=>{ if(i.cat===OLDCAT) i.cat='מזוודה' }) }
const OLDCAT='\u05DB\u05DC\u05DC\u05D9';
const bagOf=i=>(i.bag&&BAGS.includes(i.bag))?i.bag:guessBag(i);
const shopDone=new Set();
let sampleFn=null, askSeq=0;
const ask={q:'',a:'',busy:false};
const canAsk=()=>!!(AND&&typeof AND.ask==='function')||!!sampleFn;
function askInner(){
  if(!canAsk()) return '';
  return '<div class="card addbox"><b>לשאול את האפליקציה</b><form data-form="ask" class="stack"><div class="rowflex"><input class="inp" id="f-ask" placeholder="למשל: לאילו תמרוקים צריך בקבוקון קטן?" autocomplete="off" value="'+esc(ask.q)+'" style="flex:3 1 170px"><button class="btn pri" id="ask-btn" '+(ask.busy?'disabled':'')+' style="flex:0 0 auto">לשאול</button></div></form>'+
   '<div class="askout'+(ask.busy?' wait':'')+'" id="ask-out" '+((ask.a||ask.busy)?'':'hidden')+'>'+esc(ask.busy&&!ask.a?'חושבת…':ask.a)+'</div></div>';
}
function askShow(){const o=$('#ask-out'),b=$('#ask-btn'); if(o){o.hidden=!(ask.a||ask.busy);o.textContent=(ask.busy&&!ask.a)?'חושבת…':ask.a;o.classList.toggle('wait',ask.busy)} if(b)b.disabled=ask.busy}
function askPrompt(q){
  const lines=state.items.map(i=>[i.name,i.cat||'',IMPS[i.imp]||'לא סווג',STATUS[i.status]||'עוד לא נבדק',(i.status==='other'&&i.note)?i.note:'',bagOf(i)||''].join(' | ')).join('\n');
  return 'את עוזרת אריזה בתוך אפליקציית רשימת אריזה אישית. עני בעברית, בקצרה ולעניין, בטקסט פשוט בלי כוכביות ובלי סימני עיצוב, ופני אל המשתמשת בלשון נקבה. '+
   'התבססי על הרשימה שלמטה. כשהשאלה דורשת ידע כללי על אריזה או על הפריטים, השתמשי בו. אם פריט שהשאלה נוגעת בו לא מופיע ברשימה, אמרי זאת. אל תמציאי פריטים שלא ברשימה.\n\n'+
   'הנסיעה: '+state.tripName+', בתאריך '+state.tripDate+'.\n\nהרשימה (שם | קטגוריה | חשיבות | מצב | הערה | תיק):\n'+lines+'\n\nהשאלה: '+q;
}
function askGo(q){
  if(ask.busy||!q) return;
  ask.q=q; ask.a=''; ask.busy=true; askShow();
  const done=(t)=>{ask.a=t;ask.busy=false;askShow()};
  const prompt=askPrompt(q);
  if(AND&&typeof AND.ask==='function'){
    const key=(kvGet('gkey')||'').trim();
    if(!key){done('כדי לשאול שאלות באפליקציה בטלפון צריך מפתח של Gemini. מזינים אותו פעם אחת בהגדרות, בשדה "מפתח Gemini".');return}
    const id='a'+(++askSeq);
    window.orzAnswer=(rid,ok,text)=>{ if(rid!==id) return;
      if(ok) done(String(text).replace(/\*\*/g,'').trim());
      else done(/http 40[013]/.test(text)?'גוגל לא קיבלה את המפתח. כדאי לבדוק בהגדרות שהוא הודבק במלואו. ('+String(text).slice(0,120)+')':/http 429/.test(text)?'הגעת למכסת השאלות של המפתח כרגע. אפשר לנסות שוב בעוד כמה דקות.':'לא הצלחתי לקבל תשובה. כדאי לבדוק את החיבור לאינטרנט ולנסות שוב. ('+String(text).slice(0,120)+')'); };
    try{AND.ask(id,key,prompt)}catch(e){done('לא הצלחתי לשלוח את השאלה.')}
    return;
  }
  sampleFn(prompt,{cache:false,onText:u=>{ask.a=u.text;askShow()}}).then(r=>done(r.text.replace(/\*\*/g,'').trim()),e=>{
    const c=e&&e.code;
    done(c==='not_granted'?'כדי לענות צריך לאשר לדף להשתמש ב-Claude. אפשר לאשר בחלון שנפתח ולשאול שוב.':c==='rate_limited'?'יותר מדי שאלות כרגע. אפשר לנסות שוב בעוד כמה דקות.':c==='refused'?'על השאלה הזאת אני לא יכולה לענות. אפשר לנסח אותה אחרת.':((e&&e.text)?e.text+'\n\n':'')+'התשובה נקטעה. אפשר לנסות שוב.');
  });
}

const BUILTIN=[

/* ---------- storage ---------- */
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
let dirty=false, writing=false, saveT=null;
function save(){
  state.updatedAt=Date.now();
  const js=JSON.stringify(state);
  lsSet(LS,js); kvPut('state',js); planNotifs();
  if(!db) return;
  dirty=true; clearTimeout(saveT); saveT=setTimeout(flush,700);
}
async function flush(){
  if(writing||!db) return; writing=true;
  while(dirty){
    dirty=false;
    const body=JSON.parse(JSON.stringify(state));
    try{ await db.doc(base()+'/state').set(body); cloudOk=true; }
    catch(e){
      if(e&&e.code==='unavailable'){ await new Promise(r=>setTimeout(r,1200+Math.random()*800)); try{await db.doc(base()+'/state').set(body);cloudOk=true}catch(e2){cloudOk=false} }
      else cloudOk=false;
    }
  }
  writing=false;
}
const base=()=>'data/users/'+uid;
async function initCloud(){
  try{
    if(!window.claude||!window.claude.use) return;
    const [d,u]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!d||!u) return;
    const id=await u.id(); if(!id) return;
    db=d; uid=id;
    const [s,t]=await Promise.all([db.doc(base()+'/state').get(),db.doc(base()+'/template').get()]);
    cloudOk=true;
    if(t.exists){const td=t.data(); if(td&&Array.isArray(td.groups)) template=td.groups;}
    try{const sv=await db.doc(base()+'/saved').get(); if(sv.exists){const sd=sv.data(); if(sd&&Array.isArray(sd.lists)){saved=JSON.parse(JSON.stringify(sd.lists)); lsSet(LS+':saved',JSON.stringify(saved))}} else if(saved.length) persistSaved();}catch(e){}
    if(s.exists){const cd=s.data(); if(cd&&cd.v&&(!state||(cd.updatedAt||0)>=(state.updatedAt||0))){state=JSON.parse(JSON.stringify(cd)); lsSet(LS,JSON.stringify(state));}}
    else if(state&&state.phase!=='welcome'){dirty=true;flush();}
  }catch(e){}
}
async function refreshFromCloud(){
  if(!db||dirty||writing) return;
  try{const s=await db.doc(base()+'/state').get();
    if(s.exists){const cd=s.data(); if(cd&&(cd.updatedAt||0)>(state.updatedAt||0)){state=JSON.parse(JSON.stringify(cd));lsSet(LS,JSON.stringify(state));render();}}
  }catch(e){}
}

let notifT=null;
function planNotifs(){
  if(!AND||typeof AND.schedule!=='function') return;
  clearTimeout(notifT); notifT=setTimeout(()=>{
    try{
      const a=state.items.filter(i=>i.status!=='skip'),open=a.filter(i=>i.status!=='packed'),crit=open.filter(i=>i.imp==='crit');
      const names=l=>l.slice(0,6).map(i=>i.name).join(', ')+(l.length>6?' ועוד '+(l.length-6):'');
      const out=[],now=Date.now(),add=(id,at,title,text)=>{ if(!isNaN(at)&&at>now+30000) out.push({id,at,title,text}) };
      if(state.phase==='active'&&a.length){
        if(open.length) add(1,new Date(state.packStart).getTime(),'הגיע הזמן להתחיל לארוז',open.length+' פריטים מחכים'+(crit.length?', מתוכם '+crit.length+' קריטיים':'')+'. מתחילים ממה שמוכן.');
        const eve=new Date(state.tripDate+'T20:00').getTime()-864e5;
        if(crit.length) add(2,eve,'מחר נוסעים. קריטי שעוד לא בתיק:',names(crit));
        const mt=/^\d\d:\d\d$/.test(state.mornTime||'')?state.mornTime:'07:00';
        add(3,new Date(state.tripDate+'T'+mt).getTime(),'בוקר טוב! בדיקה אחרונה לפני שיוצאים',crit.length?'קריטי שעוד לא בתיק: '+names(crit):open.length?'נשארו '+open.length+' פריטים שעוד לא בתיק.':'הכול מסומן כארוז. נעבור רגע על הקריטיים.');
      }
      AND.schedule(JSON.stringify(out));
    }catch(e){}
  },800);
}

function exportText(){
  return JSON.stringify({orezet:1,tripName:state.tripName,tripDate:state.tripDate,packStart:state.packStart,mornTime:state.mornTime||'07:00',sugDone:!!state.sugDone,sugNo:state.sugNo||[],
    items:state.items.map(i=>{const o={name:i.name,cat:i.cat||'',imp:i.imp||null,status:i.status||null}; if(i.note)o.note=i.note; if(i.prev)o.prev=i.prev; if(i.noImp)o.noImp=true; if(i.bag)o.bag=i.bag; return o})});
}
function importText(txt){
  let d; try{ const a=txt.indexOf('{'),b=txt.lastIndexOf('}'); d=JSON.parse(txt.slice(a,b+1)); }catch(e){ return -1 }
  if(!d||d.orezet!==1||!Array.isArray(d.items)||!d.items.length) return -1;
  const okS=s=>Object.prototype.hasOwnProperty.call(STATUS,s)?s:null, okI=s=>Object.prototype.hasOwnProperty.call(IMP,s)?s:null;
  if(state&&state.items) state.items.filter(i=>i.thumb).forEach(i=>dropPhoto(i.id));
  const st=freshState();
  ['tripName','tripDate','packStart','mornTime'].forEach(k=>{ if(typeof d[k]==='string'&&d[k]) st[k]=d[k] });
  st.sugDone=!!d.sugDone; st.sugNo=Array.isArray(d.sugNo)?d.sugNo.filter(x=>typeof x==='string'):[];
  st.items=d.items.filter(o=>o&&typeof o.name==='string'&&o.name.trim()).map(o=>{const i={id:uidgen(),name:o.name.trim(),cat:typeof o.cat==='string'?o.cat:'',imp:okI(o.imp),status:okS(o.status)}; if(typeof o.note==='string'&&o.note)i.note=o.note; if(okS(o.prev))i.prev=o.prev; if(o.noImp)i.noImp=true; if(typeof o.bag==='string'&&BAGS.includes(o.bag))i.bag=o.bag; return i});
  st.phase='active'; state=st; hist=[]; save(); return st.items.length;
}

function persistSaved(){
  lsSet(LS+':saved',JSON.stringify(saved)); kvPut('saved',JSON.stringify(saved));
  if(db) return db.doc(base()+'/saved').set({lists:JSON.parse(JSON.stringify(saved)),at:Date.now()}).then(()=>true).catch(()=>false);
  return Promise.resolve(true);
}
function snapshot(auto){
  const n=new Date(),stamp=pad(n.getDate())+'/'+pad(n.getMonth()+1)+' '+pad(n.getHours())+':'+pad(n.getMinutes());
  const entry={id:auto?'auto':uidgen(),name:state.tripName+' · '+(auto?'אחרי השאלון · ':'')+stamp,at:Date.now(),
    items:state.items.map(i=>{const o={name:i.name,cat:i.cat||'',imp:i.imp||null,status:i.status||null}; if(i.note)o.note=i.note; if(i.bag)o.bag=i.bag; return o})};
  if(auto) saved=saved.filter(s=>s.id!=='auto');
  saved.unshift(entry); if(saved.length>12) saved.length=12;
  return persistSaved();
}
function loadSaved(id,fresh){
  const s=saved.find(x=>x.id===id); if(!s) return false;
  state.items.filter(i=>i.thumb).forEach(i=>dropPhoto(i.id));
  state.items=s.items.map(o=>{const i={id:uidgen(),name:o.name,cat:o.cat,imp:o.imp,status:o.status}; if(o.note)i.note=o.note; if(o.bag)i.bag=o.bag; if(fresh&&i.status==='packed')i.status='ready'; return i});
  state.phase='active'; state.sugDone=true; state.morningDone=''; hist=[]; save(); return true;
}

function toast(text,act){
  const t=$('#toast');
  t.innerHTML='<div><span>'+esc(text)+'</span>'+(act?'<button data-act="'+act.act+'" data-id="'+(act.id||'')+'">'+esc(act.label)+'</button>':'')+'</div>';
  clearTimeout(toast.t); toast.t=setTimeout(()=>{t.innerHTML=''},act?7000:2600);
}
function confetti(){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  const c=$('#fx'),x=c.getContext('2d'); c.width=innerWidth; c.height=innerHeight;
  const cols=['#F6BC33','#E8476A','#1AA7AD','#5B8DEF','#FFFFFF'];
  const ps=Array.from({length:90},()=>({x:c.width/2,y:c.height*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*12-3,s:5+Math.random()*6,c:cols[Math.random()*cols.length|0],r:Math.random()*6}));
  let f=0;(function tick(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});if(++f<110)requestAnimationFrame(tick);else x.clearRect(0,0,c.width,c.height)})();
}
function setStatus(it,st){
  const was=it.status; if(was===st) return;
  it.prev=was||null; it.status=st; if(!it.imp) it.imp='low';
  save();
  const a=active(),all=a.length&&a.every(i=>i.status==='packed');
  if(st==='packed'&&all){confetti();toast('הכול ארוז. אילת מחכה לך!')}
  else if(st==='packed'&&it.imp==='crit'&&!it.thumb) toast(it.name+' בתיק. לצרף תמונה להוכחה?',{label:'לצרף תמונה',act:'photo',id:it.id});
  else toast(st==='packed'?it.name+' בתיק':st==='skip'?'ויתרת על '+it.name:it.name+' עבר אל "'+STATUS[st]+'"',was?{label:'ביטול',act:'undo',id:it.id}:null);
}

/* ---------- reminders ---------- */
function reminders(){
  const r=[],its=active(),d=daysTo();
  const crit=its.filter(i=>i.imp==='crit'),open=crit.filter(i=>i.status!=='packed');
  const packed=its.filter(i=>i.status==='packed').length;
  let h=d>1?'עוד '+d+' ימים ונוסעים':d===1?'מחר נוסעים!':d===0?'היום נוסעים!':'נסיעה טובה!';
  let p=fmtDate(state.tripDate)+' · '+state.tripName+'. ';
  p+=!its.length?'':open.length?(open.length===1?'דבר קריטי אחד עוד לא בתיק.':open.length+' דברים קריטיים עוד לא בתיק.'):crit.length?'כל הדברים הקריטיים כבר בתיק.':'';
  r.push({tag:'הנסיעה',h,p});
  if(its.length&&packed===its.length){r.push({tag:'סיימת',h:'הכול ארוז',p:'אפשר לסגור את התיק ולנשום.'});return r}
  const ps=new Date(state.packStart);
  if(!isNaN(ps)&&Date.now()<ps.getTime()) r.push({tag:'האריזה',h:'מתחילים לארוז '+fmtDate(state.packStart),p:'בשעה '+fmtTime(state.packStart)+'. עד אז אפשר לסגור כביסות וקניות.'});
  else if(its.length&&packed===0) r.push({tag:'האריזה',h:'הגיע הזמן להתחיל לארוז',p:'מתחילים ממה שכבר מוכן, אחד אחד.',acts:[['להראות לי מה מוכן','goto','ready']]});
  const why={ready:'מוכן ומחכה שתכניסי אותו לתיק.',wash:'צריך כביסה לפני האריזה.',buy:'צריך לקנות אותו.',find:'צריך למצוא אותו בבית.',make:'צריך להכין אותו בבית.'};
  open.forEach(i=>r.push({tag:'קריטי',crit:1,h:i.name,p:i.status==='other'?(i.note||'צריך טיפול לפני האריזה.'):(why[i.status]||'עוד לא עברנו עליו בשאלון.'),
    acts:[['ארזתי','mv:packed',i.id],['פרטים','sheet',i.id]]}));
  [['buy','נשאר לקנות'],['wash','נשאר לכבס'],['find','נשאר למצוא בבית'],['make','נשאר להכין בבית'],['other','דברים שצריך לסדר']].forEach(([st,t])=>{
    const l=its.filter(i=>i.status===st); if(l.length) r.push({tag:STATUS[st],h:t+': '+l.length,p:l.slice(0,6).map(i=>i.name).join(', ')+(l.length>6?' ועוד':''),acts:[['לרשימה','goto',st]]});
  });
  const nophoto=crit.filter(i=>i.status==='packed'&&!i.thumb).length;
  if(nophoto) r.push({tag:'תמונות',h:(nophoto===1?'פריט קריטי אחד':nophoto+' פריטים קריטיים')+' בלי תמונה',p:'אפשר לצלם אותם בתיק כדי להיות בטוחה.',acts:[['לרשימת הארוזים','goto','packed']]});
  return r;
}
function renderRem(anim){
  const el=$('#rem'); if(!el) return;
  const r=reminders(); if(rIdx>=r.length) rIdx=0; if(rIdx<0) rIdx=r.length-1;
  const c=r[rIdx];
  el.innerHTML='<div class="rem'+(anim?' anim':'')+'"><span class="tag'+(c.crit?' crit':'')+'">'+esc(c.tag)+'</span><h2>'+esc(c.h)+'</h2><p>'+esc(c.p)+'</p>'+
   (c.acts?'<div class="acts">'+c.acts.map((a,i)=>{const mv=a[1].startsWith('mv:');return '<button class="'+(i?'alt':'')+'" data-act="'+(mv?'mv':a[1])+'" data-val="'+(mv?a[1].slice(3):a[2])+'" data-id="'+a[2]+'">'+esc(a[0])+'</button>'}).join('')+'</div>':'')+'</div>'+
   (r.length>1?'<div class="remnav"><button data-act="rprev" aria-label="התזכורת הקודמת">›</button><span>'+(rIdx+1)+' מתוך '+r.length+'</span><button data-act="rnext" aria-label="התזכורת הבאה">‹</button></div>':'<div class="remnav"></div>');
}

function caseSvg(packed,total){
  const pct=total?packed/total:0,N=20,shown=Math.round(pct*N);
  const cols=['var(--coral)','var(--sun)','#5B8DEF','var(--sea)','#9B7BD8','var(--ok)'];
  let items='';
  for(let k=0;k<shown;k++){
    const r=Math.floor(k/5),c=k%5,x=27+c*30+(r%2?3:0),y=121-r*19,col=cols[(k*5+r)%cols.length];
    if(k%4===3) items+='<circle cx="'+(x+7)+'" cy="'+(y+8)+'" r="7.5" fill="'+col+'"/><circle cx="'+(x+20)+'" cy="'+(y+8)+'" r="7.5" fill="'+col+'" opacity=".75"/>';
    else items+='<rect x="'+x+'" y="'+y+'" width="27" height="16" rx="4" fill="'+col+'"/><rect x="'+(x+4)+'" y="'+(y+4)+'" width="'+(k%3?19:11)+'" height="2.5" rx="1.2" fill="#fff" opacity=".55"/>';
  }
  const done=total&&packed===total;
  return '<div class="card casebox"><svg viewBox="0 0 200 160" role="img" aria-label="מזוודה שמתמלאת: '+packed+' מתוך '+total+' בתיק">'+
   '<path d="M78 34v-12a6 6 0 0 1 6-6h32a6 6 0 0 1 6 6v12" fill="none" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>'+
   '<rect x="16" y="34" width="168" height="112" rx="16" fill="var(--surface2)" stroke="var(--ink)" stroke-width="4"/>'+
   '<clipPath id="casein"><rect x="20" y="38" width="160" height="104" rx="12"/></clipPath><g clip-path="url(#casein)">'+items+'</g>'+
   '<rect x="40" y="148" width="14" height="8" rx="3" fill="var(--ink)"/><rect x="146" y="148" width="14" height="8" rx="3" fill="var(--ink)"/>'+
   (done?'<circle cx="160" cy="58" r="15" fill="var(--sun)"/><path d="M152 58l6 6 10-11" fill="none" stroke="#3A2A00" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>':'')+
   '</svg><div class="casetxt"><div class="disp casepct">'+Math.round(pct*100)+'%</div><div>'+(done?'הכול בתיק!':packed?packed+' מתוך '+total+' כבר בתיק':'המזוודה עוד ריקה. כל דבר שתארזי ייכנס לכאן.')+'</div></div></div>';

};
V.editor=()=>{
  let h='<div class="top"><h1>עריכת הרשימה</h1><button class="btn sm" data-act="goLists">סיימתי</button></div><p class="muted">אפשר לשנות שם, למחוק ולהוסיף. '+state.items.length+' פריטים.</p>';
  cats().concat(state.items.some(i=>!i.cat)?['']:[]).forEach(c=>{
    h+='<div class="egrp">'+esc(c||'בלי קטגוריה')+'</div>'+state.items.filter(i=>(i.cat||'')===c).map(i=>'<div class="erow"><input class="inp" id="e-'+i.id+'" data-ch="ename" data-id="'+i.id+'" value="'+esc(i.name)+'" aria-label="שם הפריט"><button class="btn sm danger" data-act="edel" data-id="'+i.id+'" aria-label="למחוק את '+esc(i.name)+'">מחיקה</button></div>').join('');
  });
  return h+'<div class="egrp">להוסיף פריט</div>'+addForm('eadd');
};
function morningQueue(){
  return active().filter(i=>!mSeen.has(i.id)&&(i.status!=='packed'||(i.imp==='crit'&&i.morningOk!==state.tripDate))).sort((a,b)=>(IMPRANK[a.imp]??3)-(IMPRANK[b.imp]??3));
}
V.morning=()=>{
  const q=morningQueue(),it=q[0];
  if(!it){
    const miss=active().filter(i=>i.status!=='packed');
    return '<div class="stack"><div class="hello">'+(miss.length?'כמעט שם':'הכול בתיק!')+'</div>'+
     (miss.length?'<p>אלה עוד לא בתיק:</p><div>'+miss.map(rowHtml).join('')+'</div><button class="btn" data-act="mAgain">לעבור שוב על מה שחסר</button>':'<p>בדקנו הכול. נסיעה טובה ובהצלחה במשחקים!</p>')+
     '<button class="btn pri" data-act="mDone">סיום הבדיקה</button></div>';
  }
  const chk=it.status==='packed';
  return '<div class="qwrap"><div class="prog"><div class="line"><span>בדיקת בוקר · נשארו '+q.length+'</span><button class="muted" data-act="goLists">לרשימה</button></div></div>'+
   '<div class="qcard"><div><div class="qcat">'+(it.imp==='crit'?'קריטי':esc(IMPS[it.imp]||''))+' · '+esc(it.cat||'')+'</div><div class="qname">'+esc(it.name)+'</div></div>'+
   '<div class="qq">'+(chk?'סימנת שזה ארוז. בדקת שזה באמת בתיק?':'זה בתיק?')+'</div>'+
   '<button class="qopt" data-act="mYes" data-id="'+it.id+'"><span class="dot s-packed"></span>כן, בתיק</button><button class="qopt" data-act="mNo" data-id="'+it.id+'"><span class="dot s-buy"></span>עוד לא</button>'+
   (it.imp==='crit'?'<button class="btn sm" data-act="photo" data-id="'+it.id+'">'+(it.thumb?'להחליף תמונה':'לצרף תמונה')+'</button>':'')+'</div></div>';
};

function render(){
  fixCats();
  if(view==='quiz'&&!unanswered().length){ view=(!state.sugDone&&sugQueue().length)?'sug':returnTo; if(view!=='sug'){ if(!state.sugDone){state.sugDone=true;save()} afterFlow(); } }
  if(view==='sug'&&!sugQueue().length){ state.sugDone=true; save(); view='lists'; afterFlow(); }
  $('#app').innerHTML=V[view]();
  if(view==='lists') renderRem(false);
  renderSheet();
}
function afterFlow(){ if(view==='lists'&&returnTo==='lists'&&state.items.length){confetti();snapshot(true);toast('סיימנו! הרשימה והתשובות נשמרו')} returnTo='lists'; }
function go(v){view=v;armed=null;todoMode=false;otherMode=false;render();scrollTo(0,0)}

function renderSheet(){
  const el=$('#sheet');
  if(viewerId){const i=item(viewerId); if(!i){viewerId=null;el.innerHTML='';return}
    el.innerHTML='<div class="scrim" data-act="closeSheet"><div class="viewer" data-stop="1"><b>'+esc(i.name)+'</b><img id="bigimg" src="'+(photoCache[i.id]||i.thumb||'')+'" alt="התמונה של '+esc(i.name)+'"><div class="rowflex"><button class="btn sm" data-act="photo" data-id="'+i.id+'">להחליף</button><button class="btn sm danger" data-act="delphoto" data-id="'+i.id+'">למחוק תמונה</button><button class="btn sm pri" data-act="closeSheet">סגירה</button></div></div></div>';
    return;}
  if(!sheetId){el.innerHTML='';return}
  const i=item(sheetId); if(!i){sheetId=null;el.innerHTML='';return}
  el.innerHTML='<div class="scrim" data-act="closeSheet"><div class="sheet" data-stop="1"><h3>'+esc(i.name)+'</h3>'+
   '<div class="lbl">להעביר אל</div><div class="grid2">'+ORDER.map(st=>'<button class="btn sm'+(i.status===st?' sel':'')+'" data-act="mv" data-val="'+st+'" data-id="'+i.id+'">'+STATUS[st]+'</button>').join('')+'</div>'+
   '<button class="btn sm'+(i.status==='skip'?' sel':'')+'" data-act="mv" data-val="skip" data-id="'+i.id+'">לא לוקחת הפעם</button>'+
   ((i.prev&&i.prev!==i.status)?'<button class="btn sun" data-act="undo" data-id="'+i.id+'">להחזיר למקום הקודם: '+STATUS[i.prev]+'</button>':'')+
   (i.status==='other'?'<label class="field">מה צריך לעשות?<input id="s-note" data-ch="note" data-id="'+i.id+'" value="'+esc(i.note||'')+'"></label>':'')+
   '<div class="lbl">לאיזה תיק זה הולך</div><div class="bagpick" style="margin:0">'+BAGS.map((b,k)=>'<button class="'+(bagOf(i)===b?'sel':'')+'" data-act="bag" data-id="'+i.id+'" data-val="'+k+'">'+b+'</button>').join('')+'</div>'+
   '<div class="lbl">כמה זה חשוב</div><div class="grid3">'+['crit','mid','low'].map(k=>'<button class="btn sm'+(i.imp===k?' sel':'')+'" data-act="imp" data-val="'+k+'" data-id="'+i.id+'">'+IMPS[k]+'</button>').join('')+'</div>'+
   (i.imp==='crit'?'<button class="btn" data-act="'+(i.thumb?'viewphoto':'photo')+'" data-id="'+i.id+'">'+(i.thumb?'לראות את התמונה':'לצרף תמונה שארזתי')+'</button>':'')+
   '<label class="field">שם הפריט<input id="s-name" data-ch="ename" data-id="'+i.id+'" value="'+esc(i.name)+'"></label>'+
   '<div class="rowflex"><button class="btn danger sm" data-act="sdel" data-id="'+i.id+'">'+(armed==='del'+i.id?'בטוחה? לחצי שוב':'למחוק מהרשימה')+'</button><button class="btn pri sm" data-act="closeSheet">סגירה</button></div></div></div>';
}

/* ---------- photos ---------- */
function shrink(img,max,q){const s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*s));c.height=Math.max(1,Math.round(img.height*s));c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q)}
function onPhoto(file){
  const id=photoTarget,it=item(id); if(!file||!it) return;
  const url=URL.createObjectURL(file),img=new Image();
  img.onload=async()=>{
    let big=shrink(img,1000,.72); if(big.length>190000) big=shrink(img,800,.6); if(big.length>190000) big=shrink(img,600,.5);
    it.thumb=shrink(img,110,.6); photoCache[id]=big; URL.revokeObjectURL(url);
    save(); render(); toast('התמונה נשמרה');
    if(db){try{await db.doc(base()+'/photo_'+id).set({data:big,at:Date.now()})}catch(e){toast('התמונה המוקטנת נשמרה, אבל המלאה לא עלתה')}}
    else if(!kvPut('p_'+id,big)) lsSet(LS+':p:'+id,big);
  };
  img.onerror=()=>{URL.revokeObjectURL(url);toast('לא הצלחתי לקרוא את התמונה. נסי תמונה אחרת')};
  img.src=url;
}
async function loadPhoto(id){
  if(photoCache[id]) return;
  let d=null;
  if(db){try{const s=await db.doc(base()+'/photo_'+id).get(); if(s.exists) d=s.data().data}catch(e){}}
  if(!d) d=kvGet('p_'+id)||lsGet(LS+':p:'+id);
  if(d){photoCache[id]=d; const im=$('#bigimg'); if(im&&viewerId===id) im.src=d;}
}
function dropPhoto(id){delete photoCache[id];lsDel(LS+':p:'+id);kvDel('p_'+id); if(db){db.doc(base()+'/photo_'+id).delete().catch(()=>{})}}

/* ---------- events ---------- */
function addFromForm(name){
  const n=$('#f-'+name+'-n').value.trim(),c=$('#f-'+name+'-c').value.trim(); if(!n) return null;
  const it={id:uidgen(),name:n,cat:c||'מזוודה',imp:null,status:null}; state.items.push(it); save(); return it;
}
document.addEventListener('submit',e=>{
  const f=e.target.closest('[data-form]'); if(!f) return; e.preventDefault();
  const k=f.dataset.form;
  if(k==='ask'){askGo($('#f-ask').value.trim());return}
  if(k==='qother'){const it=unanswered()[0],v=$('#f-other').value.trim(); if(!it) return; it.status='other'; if(v) it.note=v; hist.push(it.id); todoMode=false;otherMode=false; save(); render();}
  else if(k==='ladd'){if(addFromForm('ladd')){returnTo='lists';hist=[];go('quiz')}}
  else if(k==='eadd'){if(addFromForm('eadd')){render();toast('נוסף. נעבור עליו בשאלון')}}
});
document.addEventListener('change',e=>{
  const t=e.target; if(t.id==='photoInput'){onPhoto(t.files[0]);t.value='';return}
  const k=t.dataset.ch; if(!k) return;
  if(k==='shop'){const it=item(t.dataset.id); if(it){ if(t.checked){it.prev='buy';it.status='ready';shopDone.add(it.id)} else {it.status='buy';it.prev='ready';shopDone.delete(it.id)} save(); const l=t.closest('label'); if(l) l.classList.toggle('d',t.checked);} return}
  if(k==='gkey'){kvPut('gkey',t.value.trim());toast(t.value.trim()?'המפתח נשמר על הטלפון':'המפתח נמחק');return}
  if(k==='ename'){const it=item(t.dataset.id),v=t.value.trim(); if(it&&v){it.name=v;save(); if(sheetId){$('#app').innerHTML=V[view](); if(view==='lists')renderRem(false)}}}
  else if(k==='note'){const it=item(t.dataset.id); if(it){it.note=t.value.trim();save()}}
  else if(k==='autoRotate'){state.autoRotate=t.checked;save()}
  else if(t.value){state[k]=t.value;save()}
});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  if(b.dataset.act==='closeSheet'&&e.target.closest('[data-stop]')&&!e.target.closest('button')) return;
  const a=b.dataset.act,id=b.dataset.id,val=b.dataset.val,it=id?item(id):null;
  rPause=Date.now()+15000;
  switch(a){
    case 'startDefault': loadTemplate(template||BUILTIN); state.phase='active'; state.sugDone=false; state.sugNo=[]; hist=[]; save(); go('quiz'); break;
    case 'goNew': go('newlist'); break;
    case 'goWelcome': go('welcome'); break;
    case 'startNew': {
      const groups=[];let cur={name:'מזוודה',items:[]};groups.push(cur);
      $('#f-list').value.split('\n').map(s=>s.replace(/^[\s\-•*]+/,'').trim()).filter(Boolean).forEach(l=>{ if(/[:：]$/.test(l)){cur={name:l.replace(/[:：]$/,'').trim(),items:[]};groups.push(cur)} else cur.items.push(l) });
      if(!groups.some(g=>g.items.length)){toast('כתבי לפחות פריט אחד');break}
      loadTemplate(groups); state.phase='active'; state.sugDone=false; state.sugNo=[]; hist=[]; save(); go('quiz'); break; }
    case 'qimp': {const q=unanswered()[0]; if(q){q.imp=val;todoMode=false;save();render()} break;}
    case 'qready': {const q=unanswered()[0]; if(!q) break; if(val==='no'){todoMode=true;otherMode=false;render()} else {q.status=val;hist.push(q.id);save();render()} break;}
    case 'qtodo': {const q=unanswered()[0]; if(q){q.status=val;hist.push(q.id);todoMode=false;otherMode=false;save();render()} break;}
    case 'qothermode': otherMode=true; render(); {const f=$('#f-other'); if(f) f.focus();} break;
    case 'qback': {const q=unanswered()[0];
      if(q&&q.imp&&todoMode){todoMode=false;otherMode=false}
      else if(q&&q.imp){q.imp=null}
      else {const p=item(hist.pop()); if(p){p.status=null;p.imp=null;delete p.note;delete p.noImp;delete p.prev}}
      save();render();break;}
    case 'qskip': {const q=unanswered()[0]; if(q){if(!q.imp){q.imp='low';q.noImp=true} q.status='skip';hist.push(q.id);todoMode=false;otherMode=false;save();render()} break;}
    case 'unskip': if(it){ if(it.prev&&it.prev!=='skip'){it.status=it.prev;it.prev='skip'} else {it.status=null; if(it.noImp){it.imp=null}} delete it.noImp; save(); render(); toast(it.name+' חזר לרשימה'); } break;
    case 'undo': if(it&&it.prev&&it.prev!==it.status){ if(it.status==='skip'){it.status=it.prev;it.prev='skip';save()} else setStatus(it,it.prev); $('#toast').innerHTML=''; $('#app').innerHTML=V[view](); if(view==='lists')renderRem(false); renderSheet(); toast(it.name+' חזר אל "'+STATUS[it.status]+'"'); } break;
    case 'unpack': if(it){ setStatus(it,(it.prev&&it.prev!=='packed'&&it.prev!=='skip')?it.prev:'ready'); $('#app').innerHTML=V[view](); if(view==='lists')renderRem(false); renderSheet(); } break;
    case 'saveSnap': snapshot(false).then(ok=>{toast(ok?'העותק נשמר, כולל התשובות':'נשמר במכשיר הזה, אבל לא עלה לחשבון'); if(view==='settings')render()}); break;
    case 'loadFresh': if(loadSaved(id,true)){go('lists');toast('הרשימה נטענה עם התשובות ששמרת')} break;
    case 'qexit': go('lists'); break;
    case 'goQuiz': returnTo='lists'; hist=[]; go('quiz'); break;
    case 'goSug': go('sug'); break;
    case 'sugyes': {const s=sugQueue()[0]; if(s){state.items.push({id:uidgen(),name:s.name,cat:s.cat,imp:null,status:null});save();returnTo='lists';hist=[];go('quiz')} break;}
    case 'sugno': {const s=sugQueue()[0]; if(s){state.sugNo.push(s.name);save();render()} break;}
    case 'sugskip': state.sugDone=true; save(); go('lists'); break;
    case 'moreSug': state.sugDone=false; state.sugNo=[]; save(); if(sugQueue().length) go('sug'); else toast('אין לי הצעות חדשות כרגע'); break;
    case 'mv': if(it){setStatus(it,val); if(view!=='lists'&&view!=='morning'){} $('#app').innerHTML=V[view](); if(view==='lists')renderRem(false); renderSheet();} break;
    case 'imp': if(it){it.imp=val;save();render()} break;
    case 'sheet': sheetId=id; armed=null; renderSheet(); break;
    case 'closeSheet': sheetId=null; viewerId=null; armed=null; renderSheet(); break;
    case 'sdel': if(armed==='del'+id){state.items=state.items.filter(x=>x.id!==id); if(it&&it.thumb)dropPhoto(id); sheetId=null;armed=null;save();render()} else {armed='del'+id;renderSheet()} break;
    case 'edel': state.items=state.items.filter(x=>x.id!==id); if(it&&it.thumb)dropPhoto(id); save(); render(); break;
    case 'photo': photoTarget=id; $('#photoInput').click(); break;
    case 'viewphoto': sheetId=null; viewerId=id; renderSheet(); loadPhoto(id); break;
    case 'delphoto': if(it){delete it.thumb;dropPhoto(id);viewerId=null;save();render()} break;
    case 'goto': {const s=$('#sec-'+val); if(s) s.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth',block:'start'}); break;}
    case 'rprev': rIdx--; renderRem(true); break;
    case 'rnext': rIdx++; renderRem(true); break;
    case 'goSettings': go('settings'); break;
    case 'goTransfer': go('transfer'); break;
    case 'goShop': shopDone.clear(); go('shop'); break;
    case 'bag': if(it&&BAGS[+val]){it.bag=BAGS[+val];save();$('#app').innerHTML=V[view](); if(view==='lists')renderRem(false); renderSheet();} break;
    case 'expCopy': {
      const txt=exportText(),ta=$('#f-exp'),show=()=>{ta.hidden=false;ta.value=txt;ta.focus();ta.select();toast('סמני את כל הטקסט והעתיקי אותו')};
      if(AND&&typeof AND.copy==='function'){try{AND.copy(txt);toast('הועתק. עכשיו מדביקים במכשיר השני');break}catch(e){}}
      try{navigator.clipboard.writeText(txt).then(()=>toast('הועתק. עכשיו פותחים את האפליקציה בטלפון ומדביקים'),show)}catch(e){show()}
      break; }
    case 'impPaste': {let t='';try{t=AND.paste()||''}catch(e){} if(t) $('#f-imp').value=t; else toast('אין מה להדביק. קודם מעתיקים במכשיר השני'); break;}
    case 'impGo': {
      const txt=$('#f-imp').value.trim();
      if(!txt){toast('קודם מדביקים את הטקסט שהועתק');break}
      if(state.items.length&&armed!=='imp'){armed='imp';const keep=txt;render();$('#f-imp').value=keep;break}
      armed=null; const n=importText(txt);
      if(n<0){toast('הטקסט לא מזוהה. נסי להעתיק שוב מהמכשיר השני');break}
      go(pickView()==='morning'?'morning':'lists'); toast('הרשימה הגיעה: '+n+' פריטים עם כל התשובות'); break; }
    case 'goLists': go('lists'); break;
    case 'goEditor': go('editor'); break;
    case 'goMorning': mSeen.clear(); go('morning'); break;
    case 'mYes': if(it){mSeen.add(id);it.morningOk=state.tripDate; if(it.status!=='packed'){it.prev=it.status;it.status='packed'} save();render()} break;
    case 'mNo': mSeen.add(id); render(); break;
    case 'mAgain': mSeen.clear(); render(); break;
    case 'mDone': state.morningDone=state.tripDate; save(); go('lists'); if(active().every(i=>i.status==='packed')) confetti(); break;
    case 'saveTpl': {
      const groups=cats().map(c=>({name:c,items:state.items.filter(i=>i.cat===c).map(i=>i.name)}));
      template=groups;
      if(db) db.doc(base()+'/template').set({groups,at:Date.now()}).then(()=>toast('נשמר כרשימת ברירת המחדל')).catch(()=>toast('לא הצלחתי לשמור. נסי שוב'));
      else if(kvPut('template',JSON.stringify(groups))) toast('נשמר כרשימת ברירת המחדל'); else toast('נשמר לביקור הזה בלבד');
      break; }
    case 'arm':
      if(armed!==val){armed=val;render();break}
      armed=null;
      if(val.startsWith('load:')){ if(loadSaved(val.slice(5),false)){go('lists');toast('הרשימה השמורה נטענה')} break; }
      if(val.startsWith('dels:')){ saved=saved.filter(s=>s.id!==val.slice(5)); persistSaved(); render(); break; }
      if(val==='requiz'){state.items.forEach(i=>{i.imp=null;i.status=null;delete i.note;delete i.prev;delete i.noImp});hist=[];save();returnTo='lists';go('quiz')}
      else {state.items.filter(i=>i.thumb).forEach(i=>dropPhoto(i.id)); const keep={tripName:state.tripName,tripDate:state.tripDate,packStart:state.packStart}; state=Object.assign(freshState(),keep); save(); go('welcome')}
      break;
  }
});
let tx=null;
document.addEventListener('touchstart',e=>{tx=e.target.closest('.rem')?e.touches[0].clientX:null},{passive:true});
document.addEventListener('touchend',e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>45){rIdx+=dx>0?1:-1;rPause=Date.now()+15000;renderRem(true)}},{passive:true});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&state){refreshFromCloud(); if(view==='lists') render()}});

/* ---------- boot ---------- */
function pickView(){
  if(!state||state.phase==='welcome') return 'welcome';
  if(today()===state.tripDate&&state.morningDone!==state.tripDate&&state.items.length&&!unanswered().length) return 'morning';
  return 'lists';
}
try{const raw=lsGet(LS); if(raw){const s=JSON.parse(raw); if(s&&s.v) state=s}}catch(e){}
try{const raw=kvGet('state'); if(raw){const s=JSON.parse(raw); if(s&&s.v&&(!state||(s.updatedAt||0)>=(state.updatedAt||0))) state=s}}catch(e){}
try{const rs=kvGet('saved')||lsGet(LS+':saved'); if(rs){const a=JSON.parse(rs); if(Array.isArray(a)) saved=a}}catch(e){}
try{const rt=kvGet('template'); if(rt){const a=JSON.parse(rt); if(Array.isArray(a)) template=a}}catch(e){}
window.orzBack=function(){
  if(sheetId||viewerId){sheetId=null;viewerId=null;armed=null;renderSheet();return true}
  if(view==='lists'||view==='welcome'||view==='loading') return false;
  if(view==='newlist'||(view==='transfer'&&state.phase!=='active')){go('welcome');return true}
  if(view==='editor'||view==='transfer'){go('settings');return true}
  go('lists');return true;
};
if(state) planNotifs();
if(state&&state.phase!=='welcome'){view=pickView();render()}
startTimer();
if(!AND&&window.claude&&window.claude.use){try{window.claude.use('sample').then(s=>{ if(typeof s==='function'){sampleFn=s; const el=$('#askbox'); if(el&&view==='lists') el.innerHTML=askInner();}})}catch(e){}}
initCloud().then(()=>{
  const had=view!=='loading';
  if(!state) state=freshState();
  if(!had||view==='welcome'){view=pickView();render()}
  else if(view==='lists'||view==='morning') render();
});
})();
</script>
